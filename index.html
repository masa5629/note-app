<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>学習用カードノートアプリ (完全版)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />

    <style>
        :root[data-theme="dark"] {
            --bg-color: #1e1e1e; --panel-bg: #2d2d2d; --panel-border: #444; --text-color: #fff; --text-secondary: #aaa; --input-bg: #222; --input-border: #555; --toolbar-bg: #333; --editor-bg: #252525;
            --sunday-bg: #3b2323 !important; --saturday-bg: #232b3b !important; --holiday-bg: #3b3023 !important;
        }
        :root[data-theme="light"] {
            --bg-color: #f4f6f9; --panel-bg: #ffffff; --panel-border: #ccc; --text-color: #212529; --text-secondary: #6c757d; --input-bg: #ffffff; --input-border: #ced4da; --toolbar-bg: #e9ecef; --editor-bg: #ffffff;
            --sunday-bg: #fae8e8 !important; --saturday-bg: #e8f0fe !important; --holiday-bg: #faefe3 !important;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--panel-border); padding-bottom: 10px; align-items: center; }
        .tab-btn { background: var(--panel-bg); color: var(--text-secondary); border: 1px solid var(--panel-border); padding: 10px 20px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .schedule-controls { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 15px; background: var(--panel-bg); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--panel-border); }
        .date-range-wrapper { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .schedule-scroll-container { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px; scroll-behavior: smooth; }
        .schedule-scroll-container::-webkit-scrollbar { height: 10px; }
        .schedule-scroll-container::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 5px; }
        .calendar-view-container { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
        .calendar-header-cell { text-align: center; font-weight: bold; padding: 8px; background: var(--toolbar-bg); border-radius: 4px; font-size: 0.9em; }
        
        .calendar-cell { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px; min-height: 110px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .calendar-cell.cell-sunday { background-color: var(--sunday-bg); }
        .calendar-cell.cell-saturday { background-color: var(--saturday-bg); }
        .calendar-cell.cell-holiday { background-color: var(--holiday-bg); }
        .calendar-cell.empty { background: transparent; border: none; }

        .cal-date-num { font-weight: bold; font-size: 0.9em; display: inline-block; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
        .cal-input { width: 100%; background: var(--bg-color); border: 1px solid var(--input-border); color: var(--text-color); padding: 2px 4px; font-size: 0.8em; border-radius: 3px; margin-bottom: 2px; box-sizing: border-box; }
        .jump-btn { font-size: 0.7em; background: #007bff; color: white; border: none; border-radius: 3px; padding: 1px 4px; cursor: pointer; margin-top: 2px; align-self: flex-end; }
        
        .schedule-box { background: var(--panel-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--panel-border); min-width: 380px; flex: 0 0 auto; }
        .schedule-box.box-sunday { background-color: var(--sunday-bg); }
        .schedule-box.box-saturday { background-color: var(--saturday-bg); }
        .schedule-box.box-holiday { background-color: var(--holiday-bg); }

        .date-display { font-weight: bold; margin-bottom: 10px; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .day-saturday { color: #4dabf7; }
        .day-sunday { color: #ff6b6b; }
        .day-holiday { color: #ffa94d; }
        .day-weekday { color: var(--text-color); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--panel-border); padding: 6px; text-align: center; font-size: 0.9em; }
        th { background: var(--toolbar-bg); }
        input[type="text"] { width: 95%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-color); padding: 4px; border-radius: 3px; }
        
        .notes-area-wrapper { position: relative; }
        .cards-container { display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-start; position: relative; z-index: 1; }
        #relation-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; position: relative; resize: both; overflow: auto; width: 400px; min-width: 320px; min-height: 280px; }
        .card-header { display: flex; align-items: center; gap: 10px; }
        .card-title { font-weight: bold; font-size: 1.1em; border: none; border-bottom: 1px solid var(--panel-border); background: transparent; color: var(--text-color); width: 100%; padding: 5px; }
        .btn-delete { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 0.8em; flex-shrink: 0; }
        
        .mask-toolbar { display: flex; flex-wrap: wrap; gap: 6px; background: var(--input-bg); padding: 5px; border-radius: 4px; border: 1px solid var(--panel-border); }
        .btn-action { background: var(--toolbar-bg); color: var(--text-color); border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 0.8em; }
        .btn-action:hover { opacity: 0.8; }

        .quill-editor-container { flex-grow: 1; display: flex; flex-direction: column; }
        .ql-container { flex-grow: 1; min-height: 140px; color: var(--text-color); border-color: var(--panel-border); background: var(--editor-bg); }
        .ql-toolbar { border-color: var(--panel-border); background: var(--toolbar-bg); }

        /* 画像サイズ個別変更対応 */
        .ql-editor img { max-width: none !important; width: 250px; height: auto; cursor: pointer; display: inline-block; border: 2px solid transparent; }
        .ql-editor img.selected-img { border-color: #007bff; box-shadow: 0 0 8px rgba(0,123,255,0.6); }

        /* カスタム装飾スタイル */
        .ql-editor .mask { background-color: black !important; color: black !important; cursor: pointer; user-select: none; border-radius: 2px; }
        .ql-editor .mask.revealed { background-color: #333 !important; color: #fff !important; }
        
        .ql-editor .correction-wrapper { display: inline-flex; flex-direction: column; align-items: center; vertical-align: bottom; margin: 0 3px; }
        .ql-editor .strike-text { text-decoration: line-through double red; color: #aaa; }
        .ql-editor .correct-text { color: #ff4d4d; font-weight: bold; font-size: 0.9em; line-height: 1em; }

        .btn { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        select, input[type="date"] { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--input-border); padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="main-tabs">
        <button class="tab-btn active" onclick="switchMainTab('schedule')">📅 スケジュール・タスク</button>
        <button class="tab-btn" onclick="switchMainTab('notes')">📝 学習ノート</button>
        
        <div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
            <span id="sync-status" style="font-size: 0.8em; color: #aaa;">☁️ クラウド接続中...</span>
            <button class="btn btn-secondary" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
            <button class="btn" onclick="saveAllData()" style="background: #28a745;">💾 クラウドに保存</button>
        </div>
    </div>

    <!-- スケジュールタブ -->
    <div id="tab-schedule" class="tab-content active">
        <div class="schedule-controls">
            <span>表示モード:</span>
            <button class="btn" id="btn-mode-slide" onclick="switchScheduleMode('slide')">4ヶ月横スライド</button>
            <button class="btn btn-secondary" id="btn-mode-month" onclick="switchScheduleMode('month')">ひと月ごとカレンダー表示</button>
            
            <div id="slide-range-wrapper" class="date-range-wrapper">
                <label>範囲:</label>
                <input type="date" id="range-start" onchange="renderSchedules()">
                <span>〜</span>
                <input type="date" id="range-end" onchange="renderSchedules()">
            </div>

            <div id="month-selector-wrapper" style="display: none; margin-left: auto;">
                <label for="month-select">表示する月:</label>
                <select id="month-select" onchange="renderSchedules()"></select>
            </div>
        </div>
        <div id="schedule-container"></div>
    </div>

    <!-- 学習ノートタブ -->
    <div id="tab-notes" class="tab-content">
        <div class="toolbar" style="margin-bottom: 15px;">
            <button class="btn" onclick="addNewCard()">＋ ノート追加</button>
            <span style="font-size: 0.85em; color: var(--text-secondary); margin-left: 10px;">💡 画像をクリックして選択し、「🖼️画像サイズ変更」ボタンを押すと大きさを自由に変更できます</span>
        </div>
        <div class="notes-area-wrapper">
            <svg id="relation-svg"></svg>
            <div id="cards-container" class="cards-container"></div>
        </div>
    </div>

    <!-- Firebase SDK読み込みとクラウド連携処理 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdaWFXOfeCJwr2u-MGNyja3yUuoVoLplA",
            authDomain: "note-app-fa29b.firebaseapp.com",
            projectId: "note-app-fa29b",
            storageBucket: "note-app-fa29b.firebasestorage.app",
            messagingSenderId: "247676836666",
            appId: "1:247676836666:web:c478efbd48ee3bc5de8e03",
            measurementId: "G-GJWJPJST95"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.cloudSave = async function(data) {
            try {
                await setDoc(doc(db, "appData", "mainDoc"), data);
                document.getElementById('sync-status').textContent = "☁️ 同期完了";
                setTimeout(() => { document.getElementById('sync-status').textContent = "☁️ クラウド接続中"; }, 2000);
            } catch (e) {
                console.error("保存エラー: ", e);
                alert("クラウド保存に失敗しました");
            }
        };

        window.cloudLoad = async function() {
            try {
                const docSnap = await getDoc(doc(db, "appData", "mainDoc"));
                if (docSnap.exists()) return docSnap.data();
                return null;
            } catch (e) {
                console.error("読み込みエラー: ", e);
                return null;
            }
        };

        if (window.initCloudApp) window.initCloudApp();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <script>
        let currentScheduleMode = 'slide'; 
        let allScheduleDays = [];   
        let temporarySavedSchedules = {}; 
        let cards = [];
        let relations = []; 
        let linkingSource = null; 

        function updateEditorToolbarTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetColor = (currentTheme === 'dark') ? '#ffffff' : '#000000';
            
            document.querySelectorAll('.ql-toolbar').forEach(toolbar => {
                toolbar.querySelectorAll('.ql-stroke').forEach(el => el.style.stroke = targetColor);
                toolbar.querySelectorAll('.ql-fill').forEach(el => el.style.fill = targetColor);
                toolbar.querySelectorAll('.ql-picker').forEach(el => el.style.color = targetColor);
                toolbar.querySelectorAll('.ql-picker-label').forEach(el => el.style.color = targetColor);
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-toggle-btn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.textContent = "☀️";
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = "🌙";
            }
            renderSchedules();
            updateEditorToolbarTheme();
        }

        function switchMainTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'schedule') {
                document.querySelector('.main-tabs button:nth-child(1)').classList.add('active');
                document.getElementById('tab-schedule').classList.add('active');
            } else {
                document.querySelector('.main-tabs button:nth-child(2)').classList.add('active');
                document.getElementById('tab-notes').classList.add('active');
                setTimeout(updateEditorToolbarTheme, 50);
            }
        }

        function getJapaneseHolidayName(d) {
            const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), dayOfWeek = d.getDay();
            const springEquinox = Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
            const autumnEquinox = Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
            const weekOfMonth = Math.floor((day - 1) / 7) + 1;
            let holidayName = null;
            if (m === 1 && day === 1) holidayName = "元日";
            else if (m === 1 && dayOfWeek === 1 && weekOfMonth === 2) holidayName = "成人の日";
            else if (m === 2 && day === 11) holidayName = "建国記念の日";
            else if (m === 2 && day === 23) holidayName = "天皇誕生日";
            else if (m === 3 && day === springEquinox) holidayName = "春分の日";
            else if (m === 4 && day === 29) holidayName = "昭和の日";
            else if (m === 5 && day === 3) holidayName = "憲法記念日";
            else if (m === 5 && day === 4) holidayName = "みどりの日";
            else if (m === 5 && day === 5) holidayName = "こどもの日";
            else if (m === 7 && dayOfWeek === 1 && weekOfMonth === 3) holidayName = "海の日";
            else if (m === 8 && day === 11) holidayName = "山の日";
            else if (m === 9 && dayOfWeek === 1 && weekOfMonth === 3) holidayName = "敬老の日";
            else if (m === 9 && day === autumnEquinox) holidayName = "秋分の日";
            else if (m === 10 && dayOfWeek === 1 && weekOfMonth === 2) holidayName = "スポーツの日";
            else if (m === 11 && day === 3) holidayName = "文化の日";
            else if (m === 11 && day === 23) holidayName = "勤労感謝の日";
            return holidayName;
        }

        function initScheduleData() {
            allScheduleDays = [];
            const startDate = new Date();
            const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
            for (let i = 0; i < 365; i++) {
                const targetDate = new Date();
                targetDate.setDate(startDate.getDate() + i);
                const yyyy = targetDate.getFullYear();
                const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
                const dd = String(targetDate.getDate()).padStart(2, '0');
                const dayOfWeek = targetDate.getDay();
                allScheduleDays.push({
                    dateKey: `${yyyy}-${mm}-${dd}`, year: yyyy, month: mm, day: targetDate.getDate(),
                    dayStr: `${yyyy}年 ${mm}月${dd}日 (${dayNames[dayOfWeek]})`, dayOfWeek: dayOfWeek, holiday: getJapaneseHolidayName(targetDate)
                });
            }
            document.getElementById('range-start').value = allScheduleDays[0].dateKey;
            document.getElementById('range-end').value = allScheduleDays[allScheduleDays.length - 1].dateKey;

            const selectElem = document.getElementById('month-select');
            const monthsSet = [...new Set(allScheduleDays.map(d => `${d.year}-${d.month}`))];
            selectElem.innerHTML = "";
            monthsSet.forEach(ym => {
                const [y, m] = ym.split('-');
                const opt = document.createElement('option');
                opt.value = ym;
                opt.textContent = `${y}年 ${m}月`;
                selectElem.appendChild(opt);
            });
        }

        function switchScheduleMode(mode) {
            currentScheduleMode = mode;
            document.getElementById('btn-mode-slide').className = mode === 'slide' ? "btn" : "btn btn-secondary";
            document.getElementById('btn-mode-month').className = mode === 'month' ? "btn" : "btn btn-secondary";
            document.getElementById('slide-range-wrapper').style.display = mode === 'slide' ? "flex" : "none";
            document.getElementById('month-selector-wrapper').style.display = mode === 'month' ? "block" : "none";
            renderSchedules();
        }

        function captureCurrentInputs() {
            if (currentScheduleMode === 'slide') {
                document.querySelectorAll('.schedule-scroll-container .schedule-box').forEach(box => {
                    const dateKey = box.dataset.dateKey;
                    if (!temporarySavedSchedules[dateKey]) temporarySavedSchedules[dateKey] = {};
                    temporarySavedSchedules[dateKey].company = box.querySelector('.plan-company').value;
                    temporarySavedSchedules[dateKey].home = box.querySelector('.plan-home').value;
                    temporarySavedSchedules[dateKey].tasks = [
                        {p: box.querySelector('.t-p-1').value, a: box.querySelector('.t-a-1').value},
                        {p: box.querySelector('.t-p-2').value, a: box.querySelector('.t-a-2').value},
                        {p: box.querySelector('.t-p-3').value, a: box.querySelector('.t-a-3').value}
                    ];
                });
            } else {
                document.querySelectorAll('.calendar-cell:not(.empty)').forEach(cell => {
                    const dateKey = cell.dataset.dateKey;
                    if (!temporarySavedSchedules[dateKey]) temporarySavedSchedules[dateKey] = {};
                    temporarySavedSchedules[dateKey].company = cell.querySelector('.cal-company').value;
                    temporarySavedSchedules[dateKey].home = cell.querySelector('.cal-home').value;
                });
            }
        }

        function renderSchedules() {
            captureCurrentInputs();
            const container = document.getElementById('schedule-container');
            container.innerHTML = "";

            if (currentScheduleMode === 'slide') {
                container.className = "schedule-scroll-container";
                const startVal = document.getElementById('range-start').value;
                const endVal = document.getElementById('range-end').value;
                let daysToRender = allScheduleDays;
                if (startVal && endVal) daysToRender = allScheduleDays.filter(d => d.dateKey >= startVal && d.dateKey <= endVal);

                daysToRender.forEach(d => {
                    let boxClass = "schedule-box", dateClass = "day-weekday", displayStr = d.dayStr;
                    if (d.holiday) { boxClass += " box-holiday"; dateClass = "day-holiday"; displayStr += ` - ${d.holiday}`; }
                    else if (d.dayOfWeek === 0) { boxClass += " box-sunday"; dateClass = "day-sunday"; }
                    else if (d.dayOfWeek === 6) { boxClass += " box-saturday"; dateClass = "day-saturday"; }

                    const box = document.createElement('div');
                    box.className = boxClass;
                    box.dataset.dateKey = d.dateKey;
                    box.innerHTML = `
                        <div class="date-display ${dateClass}">${displayStr}</div>
                        <div style="margin-top: 8px; font-size: 0.9em;">
                            <label>会社: <input type="text" class="plan-company" placeholder="会社の予定"></label>
                            <label style="margin-top: 5px; display:block;">家: &nbsp;&nbsp;&nbsp;&nbsp;<input type="text" class="plan-home" placeholder="家の予定"></label>
                        </div>
                        <table>
                            <tr><th>#</th><th>タスク予定</th><th>タスク実績</th></tr>
                            <tr><td>1</td><td><input type="text" class="t-p-1"></td><td><input type="text" class="t-a-1"></td></tr>
                            <tr><td>2</td><td><input type="text" class="t-p-2"></td><td><input type="text" class="t-a-2"></td></tr>
                            <tr><td>3</td><td><input type="text" class="t-p-3"></td><td><input type="text" class="t-a-3"></td></tr>
                        </table>
                    `;
                    container.appendChild(box);

                    if (temporarySavedSchedules[d.dateKey]) {
                        const saved = temporarySavedSchedules[d.dateKey];
                        box.querySelector('.plan-company').value = saved.company || "";
                        box.querySelector('.plan-home').value = saved.home || "";
                        if (saved.tasks) {
                            saved.tasks.forEach((t, i) => {
                                box.querySelector(`.t-p-${i+1}`).value = t.p || "";
                                box.querySelector(`.t-a-${i+1}`).value = t.a || "";
                            });
                        }
                    }
                });
            } else {
                container.className = "";
                const selectedYM = document.getElementById('month-select').value; 
                const [targetY, targetM] = selectedYM.split('-').map(Number);
                const wrapper = document.createElement('div'); wrapper.className = 'calendar-view-container';
                const grid = document.createElement('div'); grid.className = 'calendar-grid';
                ["日", "月", "火", "水", "木", "金", "土"].forEach((w, idx) => {
                    const hCell = document.createElement('div'); hCell.className = 'calendar-header-cell';
                    if (idx === 0) hCell.style.color = '#ff6b6b'; if (idx === 6) hCell.style.color = '#74c0fc';
                    hCell.textContent = w; grid.appendChild(hCell);
                });
                const firstDayIndex = new Date(targetY, targetM - 1, 1).getDay();
                const lastDate = new Date(targetY, targetM, 0).getDate();
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyCell = document.createElement('div'); emptyCell.className = 'calendar-cell empty'; grid.appendChild(emptyCell);
                }
                for (let day = 1; day <= lastDate; day++) {
                    const mmStr = String(targetM).padStart(2, '0'), ddStr = String(day).padStart(2, '0');
                    const dateKey = `${targetY}-${mmStr}-${ddStr}`;
                    const cellDate = new Date(targetY, targetM - 1, day);
                    const dayOfWeek = cellDate.getDay();
                    const holiday = getJapaneseHolidayName(cellDate);

                    let cellClass = "calendar-cell", numStyle = "day-weekday";
                    if (holiday) { cellClass += " cell-holiday"; numStyle = "day-holiday"; }
                    else if (dayOfWeek === 0) { cellClass += " cell-sunday"; numStyle = "day-sunday"; }
                    else if (dayOfWeek === 6) { cellClass += " cell-saturday"; numStyle = "day-saturday"; }

                    const cell = document.createElement('div'); 
                    cell.className = cellClass; 
                    cell.dataset.dateKey = dateKey;

                    const saved = temporarySavedSchedules[dateKey] || {};
                    cell.innerHTML = `
                        <div><span class="cal-date-num ${numStyle}">${day} ${holiday ? '('+holiday+')' : ''}</span></div>
                        <div>
                            <input type="text" class="cal-input cal-company" placeholder="会社予定" value="${saved.company || ''}">
                            <input type="text" class="cal-input cal-home" placeholder="家予定" value="${saved.home || ''}">
                        </div>
                        <button class="jump-btn">詳細 ➔</button>
                    `;
                    cell.querySelector('.jump-btn').addEventListener('click', () => {
                        captureCurrentInputs();
                        switchMainTab('schedule'); switchScheduleMode('slide');
                        setTimeout(() => {
                            const b = document.querySelector(`.schedule-scroll-container .schedule-box[data-date-key="${dateKey}"]`);
                            if (b) b.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                        }, 50);
                    });
                    grid.appendChild(cell);
                }
                wrapper.appendChild(grid); container.appendChild(wrapper);
            }
        }

        // Quill カスタムBlot（マスク、訂正）
        const Inline = Quill.import('blots/inline');
        
        class MaskBlot extends Inline {
            static create() { let n = super.create(); n.setAttribute('class', 'mask'); return n; }
            static formats(n) { return n.getAttribute('class')?.includes('mask'); }
        }
        MaskBlot.blotName = 'mask'; MaskBlot.tagName = 'span'; Quill.register(MaskBlot, true);

        class CorrectionBlot extends Inline {
            static create(value) {
                let node = super.create();
                node.setAttribute('class', 'correction-wrapper');
                let strike = document.createElement('span');
                strike.setAttribute('class', 'strike-text');
                strike.innerText = value.oldText;
                let correct = document.createElement('span');
                correct.setAttribute('class', 'correct-text');
                correct.innerText = value.newText;
                node.appendChild(strike);
                node.appendChild(correct);
                return node;
            }
            static formats(node) {
                let strike = node.querySelector('.strike-text');
                let correct = node.querySelector('.correct-text');
                return { oldText: strike ? strike.innerText : '', newText: correct ? correct.innerText : '' };
            }
        }
        CorrectionBlot.blotName = 'correction'; CorrectionBlot.tagName = 'span'; Quill.register(CorrectionBlot, true);


        function addNewCard(title = "", contentHtml = "") {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div'); card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <input type="text" class="card-title" placeholder="タイトル" value="${title}">
                    <button class="btn-delete" title="削除">🗑️ 削除</button>
                </div>
                <div class="mask-toolbar">
                    <button class="btn-action btn-apply-mask">🔒 マスク</button>
                    <button class="btn-action btn-remove-mask">🔓 解除</button>
                    <button class="btn-action btn-correct" style="color:#ff4d4d; font-weight:bold;">🖋️ 訂正</button>
                    <button class="btn-action btn-remove-correct">↩️ 訂正解除</button>
                    <button class="btn-action btn-resize-img" style="color:#007bff; font-weight:bold;">🖼️ 画像サイズ変更</button>
                </div>
                <div class="quill-editor-container"></div>
            `;
            container.appendChild(card);
            
            const toolbarOptions = [
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': ['#000000', '#e60000', '#0066cc', '#009900', '#990099', '#ff6600'] }],
                [{ 'background': ['#ffff00', '#00ff00', '#00ffff', '#ff99ff', '#ff9999'] }],
                ['image'],
                [{ 'header': [1, 2, false] }],
                ['clean']
            ];

            const quill = new Quill(card.querySelector('.quill-editor-container'), {
                modules: { toolbar: toolbarOptions },
                theme: 'snow'
            });
            if (contentHtml) quill.clipboard.dangerouslyPasteHTML(contentHtml);

            updateEditorToolbarTheme();

            quill.root.addEventListener('click', function(e) {
                if (e.target.tagName === 'IMG') {
                    card.querySelectorAll('.ql-editor img').forEach(img => img.classList.remove('selected-img'));
                    e.target.classList.add('selected-img');
                } else if (e.target.classList.contains('mask') || e.target.closest('.mask')) {
                    const maskEl = e.target.classList.contains('mask') ? e.target : e.target.closest('.mask');
                    maskEl.classList.toggle('revealed');
                }
            });

            cards.push({ cardElement: card, titleInput: card.querySelector('.card-title'), quill: quill });

            card.querySelector('.btn-apply-mask').addEventListener('click', () => {
                const r = quill.getSelection(); if (r && r.length > 0) quill.formatText(r.index, r.length, 'mask', true);
            });
            card.querySelector('.btn-remove-mask').addEventListener('click', () => {
                const r = quill.getSelection(); if (r && r.length > 0) quill.formatText(r.index, r.length, 'mask', false);
            });

            card.querySelector('.btn-correct').addEventListener('click', () => {
                const r = quill.getSelection();
                if (!r || r.length === 0) return alert("訂正するテキストを選択してください。");
                const oldText = quill.getText(r.index, r.length);
                const newText = prompt(`「${oldText}」に対する正しい内容（朱字）を入力：`, "");
                if (newText !== null) {
                    quill.deleteText(r.index, r.length);
                    quill.insertEmbed(r.index, 'correction', { oldText: oldText, newText: newText }, Quill.sources.USER);
                }
            });

            card.querySelector('.btn-remove-correct').addEventListener('click', () => {
                const r = quill.getSelection();
                if (!r) return;
                const [leaf] = quill.getLeaf(r.index);
                if (leaf && leaf.domNode.parentNode.classList.contains('correction-wrapper')) {
                    const wrapper = leaf.domNode.parentNode;
                    const strikeSpan = wrapper.querySelector('.strike-text');
                    const originalText = strikeSpan ? strikeSpan.innerText : "";
                    const index = quill.findIndex(wrapper);
                    quill.deleteText(index, 1);
                    quill.insertText(index, originalText);
                }
            });

            card.querySelector('.btn-resize-img').addEventListener('click', () => {
                const selectedImg = card.querySelector('.ql-editor img.selected-img');
                if (!selectedImg) {
                    alert("サイズを変更したい画像をノート内でクリックして選択（青枠を表示）してください。");
                    return;
                }
                const currentWidth = selectedImg.style.width || "250px";
                const newWidth = prompt("画像の横幅を指定してください（例: 150px, 300px, 500px など）:", currentWidth);
                if (newWidth) {
                    selectedImg.style.width = newWidth;
                    selectedImg.style.height = 'auto';
                }
            });

            card.querySelector('.btn-delete').addEventListener('click', () => {
                container.removeChild(card);
                cards = cards.filter(c => c.cardElement !== card);
            });
        }

        window.saveAllData = async function() {
            captureCurrentInputs();
            const data = {
                schedules: temporarySavedSchedules,
                cards: cards.map(c => ({ title: c.titleInput.value, content: c.quill.root.innerHTML }))
            };
            if (window.cloudSave) {
                await window.cloudSave(data);
                alert("クラウドに保存しました！");
            }
        };

        window.initCloudApp = async function() {
            initScheduleData();
            if (window.cloudLoad) {
                const data = await window.cloudLoad();
                if (data && data.schedules) temporarySavedSchedules = data.schedules;
                renderSchedules();
                if (data && data.cards && data.cards.length > 0) {
                    data.cards.forEach(c => addNewCard(c.title, c.content));
                } else {
                    addNewCard("学習ノート 1", "例: <span class='mask'>暗記項目</span>");
                }
            }
        };
    </script>
</body>
</html>
